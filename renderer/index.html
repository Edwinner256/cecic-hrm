<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:;" />
  <title>HR Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ─── Login Page ─────────────────────────────────────────── -->
  <div id="loginPage">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-img">
          <i class="bi bi-shield-check"></i>
        </div>
        <div class="login-logo-text">HR Management</div>
        <div class="login-logo-sub">CECIC Online HRMS Uganda</div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" value="admin" autofocus />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" value="admin123" />
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-key"></i> Sign In
        </button>
        <div class="login-error" id="loginError"></div>
        <div class="forgot-password-link">
          <a href="#" onclick="App.showPasswordReset()">Forgot Password?</a>
        </div>
        <div id="loginHelp"></div>
      </form>

      <div class="login-footer-text">
        &copy; 2026 CECIC HRMS
      </div>
    </div>
  </div>

  <!-- ─── Main App ────────────────────────────────────────────── -->
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <img id="sidebarLogo" class="sidebar-logo-img" src="" alt="Logo" style="display:none" />
        <i class="bi bi-buildings" id="sidebarDefaultLogo"></i>
        <span class="sidebar-title">HRMS</span>
        <span class="sidebar-subtitle" id="sidebarCompanyName">Online Edition</span>
      </div>

      <div class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" data-roles="admin,finance,staff" href="#">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-page="employees" data-roles="admin,finance" href="#">
          <i class="bi bi-people-fill"></i>
          <span>Employees</span>
        </a>
        <a class="nav-item" data-page="leave" data-roles="admin,finance,staff" href="#">
          <i class="bi bi-calendar-check-fill"></i>
          <span>Leave Management</span>
        </a>
        <a class="nav-item" data-page="payroll" data-roles="admin,finance" href="#">
          <i class="bi bi-cash-coin"></i>
          <span>Payroll</span>
        </a>
        <a class="nav-item" data-page="pettyCash" data-roles="admin,finance" href="#">
          <i class="bi bi-piggy-bank-fill"></i>
          <span>Petty Cash</span>
        </a>
        <a class="nav-item" data-page="officeForms" data-roles="admin,finance,staff" href="#">
          <i class="bi bi-file-earmark-text-fill"></i>
          <span>Forms & Documents</span>
        </a>
        <a class="nav-item" data-page="expenses" data-roles="admin,finance" href="#">
          <i class="bi bi-receipt-cutoff"></i>
          <span>Officer Expenses</span>
        </a>
        <a class="nav-item" data-page="reports" data-roles="admin,finance,staff" href="#">
          <i class="bi bi-bar-chart-fill"></i>
          <span>Reports</span>
        </a>
        <a class="nav-item" data-page="email" data-roles="admin" href="#">
          <i class="bi bi-envelope-at-fill"></i>
          <span>Email / Sync</span>
        </a>
        <a class="nav-item" data-page="settings" data-roles="admin" href="#">
          <i class="bi bi-gear-wide-connected"></i>
          <span>Settings</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="sidebar-user-info" id="sidebarUserInfo" style="display:none">
          <i class="bi bi-person-circle"></i>
          <div class="sidebar-user-details">
            <span class="sidebar-user-name" id="sidebarUserName">User</span>
            <span class="sidebar-user-role" id="sidebarUserRole">staff</span>
          </div>
        </div>
        <div class="connection-status offline" id="connectionStatus">
          <i class="bi bi-cloud-slash-fill"></i>
          <span>Disconnected</span>
        </div>
        <div id="envIndicator" class="app-version"></div>
        <button class="btn btn-sm btn-outline" onclick="App.logout()" style="color:#f87171;border-color:rgba(255,255,255,0.1);justify-content:center">
          <i class="bi bi-box-arrow-left"></i> Sign Out
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Top Bar -->
      <header id="topbar">
        <div class="topbar-left">
          <img id="topbarLogo" class="topbar-company-logo" src="" alt="" style="display:none" />
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline" id="btnRefresh" title="Refresh Data">
            <i class="bi bi-arrow-repeat"></i>
          </button>
          <button class="btn btn-outline" id="btnPrint" title="Print Current View">
            <i class="bi bi-printer-fill"></i>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div id="page-content">
        <!-- Each page is a div that gets shown/hidden -->
        <div id="page-dashboard" class="page active"></div>
        <div id="page-employees" class="page"></div>
        <div id="page-leave" class="page"></div>
        <div id="page-payroll" class="page"></div>
        <div id="page-pettyCash" class="page"></div>
        <div id="page-officeForms" class="page"></div>
        <div id="page-expenses" class="page"></div>
        <div id="page-reports" class="page"></div>
        <div id="page-email" class="page"></div>
        <div id="page-settings" class="page"></div>
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer"></div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/employees.js"></script>
  <script src="js/modules/leave.js"></script>
  <script src="js/modules/payroll.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/email.js"></script>
  <script src="js/modules/pettyCash.js"></script>
  <script src="js/modules/officeForms.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
