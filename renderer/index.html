<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:;" />
  <title>HR Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ─── Login Page ─────────────────────────────────────────── -->
  <div id="loginPage">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-img">
          <i class="bi bi-building"></i>
        </div>
        <div class="login-logo-text">HR Management</div>
        <div class="login-logo-sub">Offline HRMS Uganda</div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label>Username</label>
          <input type="text" class="form-control" id="loginUsername" placeholder="Enter your username" value="admin" autofocus />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Enter your password" value="admin123" />
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
        <div class="login-error" id="loginError"></div>
      </form>

      <div class="login-footer-text">
        &copy; 2026 Offline HRMS &mdash; Works offline, everywhere
      </div>
    </div>
  </div>

  <!-- ─── Main App ────────────────────────────────────────────── -->
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-header">
        <img id="sidebarLogo" class="sidebar-logo-img" src="" alt="Logo" style="display:none" />
        <i class="bi bi-building" id="sidebarDefaultLogo"></i>
        <span class="sidebar-title">HRMS</span>
        <span class="sidebar-subtitle" id="sidebarCompanyName">Offline Edition</span>
      </div>

      <div class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" href="#">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" data-page="employees" href="#">
          <i class="bi bi-people"></i>
          <span>Employees</span>
        </a>
        <a class="nav-item" data-page="leave" href="#">
          <i class="bi bi-calendar-check"></i>
          <span>Leave Management</span>
        </a>
        <a class="nav-item" data-page="payroll" href="#">
          <i class="bi bi-cash-stack"></i>
          <span>Payroll</span>
        </a>
        <a class="nav-item" data-page="expenses" href="#">
          <i class="bi bi-receipt"></i>
          <span>Officer Expenses</span>
        </a>
        <a class="nav-item" data-page="reports" href="#">
          <i class="bi bi-file-earmark-bar-graph"></i>
          <span>Reports</span>
        </a>
        <a class="nav-item" data-page="email" href="#">
          <i class="bi bi-envelope-paper"></i>
          <span>Email / Sync</span>
        </a>
        <a class="nav-item" data-page="settings" href="#">
          <i class="bi bi-gear"></i>
          <span>Settings</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="connection-status offline" id="connectionStatus">
          <i class="bi bi-wifi-off"></i>
          <span>Offline</span>
        </div>
        <div id="envIndicator" class="app-version"></div>
        <button class="btn btn-sm btn-outline" onclick="App.logout()" style="color:#f87171;border-color:rgba(255,255,255,0.1);justify-content:center">
          <i class="bi bi-box-arrow-left"></i> Sign Out
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Top Bar -->
      <header id="topbar">
        <div class="topbar-left">
          <img id="topbarLogo" class="topbar-company-logo" src="" alt="" style="display:none" />
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline" id="btnRefresh" title="Refresh Data">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button class="btn btn-outline" id="btnPrint" title="Print Current View">
            <i class="bi bi-printer"></i>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div id="page-content">
        <!-- Each page is a div that gets shown/hidden -->
        <div id="page-dashboard" class="page active"></div>
        <div id="page-employees" class="page"></div>
        <div id="page-leave" class="page"></div>
        <div id="page-payroll" class="page"></div>
        <div id="page-expenses" class="page"></div>
        <div id="page-reports" class="page"></div>
        <div id="page-email" class="page"></div>
        <div id="page-settings" class="page"></div>
      </div>
    </main>
  </div>

  <!-- Modal Container -->
  <div id="modalContainer"></div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/database.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/employees.js"></script>
  <script src="js/modules/leave.js"></script>
  <script src="js/modules/payroll.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/email.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
